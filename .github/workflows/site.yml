name: Site

# Publie le dossier site/ sur l'hébergement OVH de dnmax.fr, par SFTP, à chaque
# fusion dans main qui le modifie, ou à la demande (bouton « Run workflow »).
#
# Les fichiers distants absents du dépôt sont supprimés : le dossier distant
# doit être réservé au site.
#
# Réglages (Settings → Secrets and variables → Actions) :
#   variable OVH_SITE_SERVEUR       serveur SFTP, par exemple ftp.cluster129.hosting.ovh.net
#   variable OVH_SITE_DOSSIER       dossier distant du site, « www » par défaut
#   secret   OVH_SITE_UTILISATEUR   identifiant FTP/SFTP de l'hébergement
#   secret   OVH_SITE_MOT_DE_PASSE  son mot de passe
#   secret   OVH_SITE_CLE_HOTE      la ligne « known_hosts » du serveur : la lancer une
#                                   première fois avec l'action « afficher-cle-serveur »,
#                                   qui l'écrit dans le résumé de l'exécution
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "publier le site, ou seulement afficher la clé du serveur (première mise en place)"
        type: choice
        options: [publier, afficher-cle-serveur]
        default: publier

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  cle:
    name: Clé du serveur
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'afficher-cle-serveur'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Lecture de la clé publique du serveur
        env:
          SERVEUR: ${{ vars.OVH_SITE_SERVEUR }}
        run: |
          if [ -z "$SERVEUR" ]; then echo "::error::Variable OVH_SITE_SERVEUR manquante."; exit 1; fi
          ligne="$(ssh-keyscan -t ed25519 -p 22 "$SERVEUR" 2>/dev/null)"
          if [ -z "$ligne" ]; then echo "::error::Le serveur $SERVEUR ne répond pas en SFTP (port 22)."; exit 1; fi
          empreinte="$(printf '%s\n' "$ligne" | ssh-keygen -lf -)"
          {
            echo "### Clé du serveur $SERVEUR"
            echo
            echo "À copier telle quelle dans le secret \`OVH_SITE_CLE_HOTE\` :"
            echo
            echo '```'
            echo "$ligne"
            echo '```'
            echo
            echo "Empreinte : \`$empreinte\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Clé écrite dans le résumé de l'exécution."

  publier:
    name: Envoi chez OVH
    if: github.event_name == 'push' || inputs.action == 'publier'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Les réglages sont renseignés
        env:
          SERVEUR: ${{ vars.OVH_SITE_SERVEUR }}
          UTILISATEUR: ${{ secrets.OVH_SITE_UTILISATEUR }}
          MOT_DE_PASSE: ${{ secrets.OVH_SITE_MOT_DE_PASSE }}
          CLE_HOTE: ${{ secrets.OVH_SITE_CLE_HOTE }}
        run: |
          # On ne regarde que la présence des secrets, jamais leur contenu.
          manque=0
          for nom in SERVEUR UTILISATEUR MOT_DE_PASSE CLE_HOTE; do
            if [ -z "${!nom}" ]; then echo "::error::Réglage manquant : $nom (voir l'en-tête de ce fichier)."; manque=1; fi
          done
          exit "$manque"
      - name: Outil d'envoi
        run: outils/installer-bibliotheques-linux.sh lftp
      - name: Envoi du site
        env:
          SERVEUR: ${{ vars.OVH_SITE_SERVEUR }}
          DOSSIER: ${{ vars.OVH_SITE_DOSSIER || 'www' }}
          UTILISATEUR: ${{ secrets.OVH_SITE_UTILISATEUR }}
          LFTP_PASSWORD: ${{ secrets.OVH_SITE_MOT_DE_PASSE }}
          CLE_HOTE: ${{ secrets.OVH_SITE_CLE_HOTE }}
        run: |
          # La clé du serveur est vérifiée : jamais d'acceptation aveugle.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE_HOTE" > ~/.ssh/known_hosts
          # Le mot de passe passe par LFTP_PASSWORD (--env-password), pas par la ligne de commande.
          lftp -c "
            set net:max-retries 3; set net:timeout 30;
            set sftp:auto-confirm no;
            open --env-password -u \"$UTILISATEUR\" \"sftp://$SERVEUR\";
            mirror --reverse --delete --verbose site/ \"$DOSSIER\"
          "
      - name: Le site répond
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://dnmax.fr/)"
          echo "https://dnmax.fr/ répond $code"
          [ "$code" = "200" ]
