name: Installeurs

# Produit les installeurs des trois systèmes, sans les publier : ils sont
# joints à l'exécution, à télécharger depuis l'onglet « Actions ».
# - à la demande (bouton « Run workflow ») ;
# - pour toute branche « essai-installeurs/… », afin d'essayer un changement
#   sur un vrai poste avant de le fusionner.
# Les versions destinées aux enseignants passent par l'atelier « Publication ».
on:
  workflow_dispatch:
  push:
    branches: ["essai-installeurs/**"]

permissions:
  contents: read

concurrency:
  group: installeurs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Windows
            machine: windows-2025
            options: ""
            fichiers: |
              src-tauri/target/release/bundle/nsis/*.exe
          - nom: macOS
            machine: macos-15
            # Un seul fichier pour les Mac Intel et Apple Silicon.
            options: "--target universal-apple-darwin"
            fichiers: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - nom: Linux
            machine: ubuntu-24.04
            options: ""
            fichiers: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Bibliothèques système requises par Tauri
        if: runner.os == 'Linux'
        run: outils/installer-bibliotheques-linux.sh
      - name: Cibles Rust pour les deux familles de Mac
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build ${{ matrix.options }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DNMAX-${{ matrix.nom }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error
          retention-days: 14
