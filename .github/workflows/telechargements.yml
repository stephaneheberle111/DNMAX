name: Téléchargements

# Dépose sur dnmax.fr (dossier telechargements/) les installeurs Windows,
# macOS et Debian/Ubuntu de la dernière version publiée, pour que les
# visiteurs du site les téléchargent en France, chez OVH. L'AppImage Linux,
# trop lourde pour l'hébergement gratuit, et les fichiers de mise à jour
# restent sur GitHub.
#
# Déclenchement : publication d'une version sur GitHub, ou à la demande.
# Réglages : les mêmes que l'atelier « Site » (OVH_SITE_*).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deposer:
    name: Dépôt des installeurs chez OVH
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FICHIERS: "DNMAX-windows.exe DNMAX-macos.dmg DNMAX-linux.deb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Les réglages sont renseignés
        env:
          SERVEUR: ${{ vars.OVH_SITE_SERVEUR }}
          UTILISATEUR: ${{ secrets.OVH_SITE_UTILISATEUR }}
          MOT_DE_PASSE: ${{ secrets.OVH_SITE_MOT_DE_PASSE }}
          CLE_HOTE: ${{ secrets.OVH_SITE_CLE_HOTE }}
        run: |
          # On ne regarde que la présence des secrets, jamais leur contenu.
          manque=0
          for nom in SERVEUR UTILISATEUR MOT_DE_PASSE CLE_HOTE; do
            if [ -z "${!nom}" ]; then echo "::error::Réglage manquant : $nom (voir l'atelier « Site »)."; manque=1; fi
          done
          exit "$manque"
      - name: Installeurs de la dernière version publiée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telechargements
          # Sans étiquette, gh prend la dernière version publiée (jamais un brouillon).
          for fichier in $FICHIERS; do
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "$fichier" --dir telechargements
          done
          ls -l telechargements
          # L'hébergement gratuit est limité à 100 Mo : on refuse d'y dépasser 60 Mo d'installeurs.
          total=$(du -sm telechargements | cut -f1)
          if [ "$total" -gt 60 ]; then echo "::error::Installeurs trop lourds pour l'hébergement ($total Mo)."; exit 1; fi
      - name: Outil d'envoi
        run: outils/installer-bibliotheques-linux.sh lftp
      - name: Dépôt
        env:
          SERVEUR: ${{ vars.OVH_SITE_SERVEUR }}
          DOSSIER: ${{ vars.OVH_SITE_DOSSIER || 'www' }}
          UTILISATEUR: ${{ secrets.OVH_SITE_UTILISATEUR }}
          LFTP_PASSWORD: ${{ secrets.OVH_SITE_MOT_DE_PASSE }}
          CLE_HOTE: ${{ secrets.OVH_SITE_CLE_HOTE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE_HOTE" > ~/.ssh/known_hosts
          lftp -c "
            set net:max-retries 3; set net:timeout 30;
            set sftp:auto-confirm no;
            open --env-password -u \"$UTILISATEUR\" \"sftp://$SERVEUR\";
            mkdir -p \"$DOSSIER/telechargements\";
            mirror --reverse --delete --verbose telechargements/ \"$DOSSIER/telechargements\"
          "
      - name: Les installeurs répondent
        run: |
          for fichier in $FICHIERS; do
            code="$(curl -sS -r 0-1023 -o /dev/null -w '%{http_code}' --max-time 30 "https://dnmax.fr/telechargements/$fichier")"
            echo "$fichier : $code"
            [ "$code" = "206" ] || [ "$code" = "200" ]
          done
