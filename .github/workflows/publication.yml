name: Publication

# Prépare une version pour les enseignants : construit les installeurs des trois
# systèmes, les signe pour la mise à jour automatique, puis crée un BROUILLON
# de version sur GitHub. La version est celle déclarée dans package.json.
#
# Déclenchement : bouton « Run workflow » sur la branche main, et rien d'autre.
# La poussée d'une étiquette ne le déclenche pas : c'est la publication du
# brouillon qui pose l'étiquette, et l'atelier se relancerait alors pour rien.
#
# Rien n'est diffusé tant que le brouillon n'est pas publié à la main : c'est
# la publication qui déclenche la proposition de mise à jour sur les postes.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   TAURI_SIGNING_PRIVATE_KEY           clé privée de signature des mises à jour
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  son mot de passe
#
# Sans les Mac : décocher « avec_macos ». La version paraît pour Windows et
# Linux ; l'atelier « Complément macOS » ajoute ensuite les fichiers Mac à la
# même version, quand une machine macOS est disponible.
on:
  workflow_dispatch:
    inputs:
      avec_macos:
        description: "Construire aussi pour macOS (décocher si les machines macOS manquent)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifications préalables
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      etiquette: ${{ steps.version.outputs.etiquette }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Les versions déclarées concordent
        id: version
        env:
          TYPE_REFERENCE: ${{ github.ref_type }}
          REFERENCE: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          version_enveloppe="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$version_enveloppe" ]; then
            echo "::error::package.json annonce $version et Cargo.toml $version_enveloppe."
            exit 1
          fi
          if [ "$TYPE_REFERENCE" != "branch" ] || [ "$REFERENCE" != "main" ]; then
            echo "::error::Une version se publie depuis main, pas depuis $REFERENCE."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "etiquette=v$version" >> "$GITHUB_OUTPUT"
      - name: Cette version n'a pas déjà été publiée
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETTE: ${{ steps.version.outputs.etiquette }}
        run: |
          # Un brouillon resté en attente peut être refait ; une version publiée ne se remplace pas.
          if [ "$(gh release view "$ETIQUETTE" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::La version $ETIQUETTE est déjà publiée. Montez le numéro de version avant de publier."
            exit 1
          fi
      - name: La clé publique de mise à jour est renseignée
        run: |
          if [ -z "$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json)" ]; then
            echo "::error::plugins.updater.pubkey est vide dans src-tauri/tauri.conf.json (voir README, « Publier une version »)."
            exit 1
          fi
      - name: La clé privée de signature est disponible
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # On ne regarde que la présence du secret, jamais son contenu.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY n'est pas défini pour ce dépôt."
            exit 1
          fi

  construire:
    name: ${{ matrix.nom }}
    needs: verifier
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - nom: Windows
            machine: windows-2025
            options: ""
            fichiers: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - nom: Linux
            machine: ubuntu-24.04
            options: ""
            fichiers: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Bibliothèques système requises par Tauri
        if: runner.os == 'Linux'
        run: outils/installer-bibliotheques-linux.sh
      - run: npm ci
      - name: Construction et signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Les fichiers de mise à jour ne sont produits qu'ici : les autres constructions n'ont pas la clé privée.
        run: npx tauri build ${{ matrix.options }} --config src-tauri/tauri.publication.conf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ matrix.nom }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error
          retention-days: 7

  construire-macos:
    name: macOS
    needs: verifier
    if: ${{ inputs.avec_macos }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Cibles Rust pour les deux familles de Mac
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: src-tauri
      - run: npm ci
      - name: Construction et signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Un seul fichier pour les Mac Intel et Apple Silicon.
        run: npx tauri build --target universal-apple-darwin --config src-tauri/tauri.publication.conf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-macOS
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

  publier:
    name: Brouillon de version
    needs: [verifier, construire, construire-macos]
    # macOS est facultatif : sauté, il n'empêche pas le brouillon ; échoué, si.
    if: ${{ !cancelled() && needs.construire.result == 'success' && (needs.construire-macos.result == 'success' || needs.construire-macos.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: publication-*
          path: publication
          merge-multiple: true
      - name: Manifeste de mise à jour
        env:
          VERSION: ${{ needs.verifier.outputs.version }}
          ETIQUETTE: ${{ needs.verifier.outputs.etiquette }}
          SYSTEMES: ${{ inputs.avec_macos && 'windows,linux,macos' || 'windows,linux' }}
          NOTES_VERSION: "Voir le journal des modifications : https://github.com/${{ github.repository }}/blob/${{ needs.verifier.outputs.etiquette }}/CHANGELOG.md"
        run: |
          # Les fichiers peuvent arriver rangés par sous-dossier : on les met à plat.
          find publication -mindepth 2 -type f -exec mv -t publication {} +
          find publication -mindepth 1 -type d -empty -delete
          node outils/ecrire-manifeste.ts publication "$VERSION" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ETIQUETTE}" "$SYSTEMES"
      - name: Copies à nom fixe pour les liens de téléchargement du site
        # Le site pointe sur « releases/latest/download/<nom> » : il lui faut des noms
        # qui ne changent pas d'une version à l'autre. Fait après le manifeste, qui
        # doit continuer à désigner les fichiers signés sous leur nom d'origine.
        run: |
          cp publication/*-setup.exe publication/DNMAX-windows.exe
          if ls publication/*.dmg >/dev/null 2>&1; then cp publication/*.dmg publication/DNMAX-macos.dmg; fi
          cp publication/*.AppImage publication/DNMAX-linux.AppImage
          cp publication/*.deb publication/DNMAX-linux.deb
      - name: Brouillon de version sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETTE: ${{ needs.verifier.outputs.etiquette }}
          VERSION: ${{ needs.verifier.outputs.version }}
        run: |
          # Un brouillon précédent de la même version est remplacé.
          gh release delete "$ETIQUETTE" --yes 2>/dev/null || true
          gh release create "$ETIQUETTE" publication/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "DNMAX $VERSION" \
            --notes "Voir le journal des modifications : https://github.com/${GITHUB_REPOSITORY}/blob/${ETIQUETTE}/CHANGELOG.md"
