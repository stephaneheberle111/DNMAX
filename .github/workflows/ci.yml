name: Intégration continue

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    name: Interface (linter, typage, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: L'installation livrée ne contient aucune donnée
        run: |
          npx playwright install --with-deps chromium
          npm run verifier:vide
      - name: La saisie d'une évaluation s'enregistre d'elle-même
        run: npm run verifier:saisie

  enveloppe:
    name: Enveloppe de bureau (format, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Compilation Rust gardée d'une exécution à l'autre : sans elle, chaque exécution recompile
      # toutes les dépendances. Renouvelée quand Cargo.lock ou la chaîne d'outils changent.
      - name: Cache de la compilation Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Bibliothèques système requises par Tauri
        run: outils/installer-bibliotheques-linux.sh
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
