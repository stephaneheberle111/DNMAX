[package]
name = "dnmax"
version = "0.3.0"
description = "Évaluations par compétences pour les enseignants de DN MADE"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.97"
publish = false

[lib]
name = "dnmax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
time = "0.3"
zeroize = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
rand_chacha = "0.3"
tempfile = "3"
