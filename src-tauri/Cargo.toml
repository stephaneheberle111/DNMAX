[package]
name = "dnmax"
version = "0.1.0"
description = "Évaluations par compétences pour les enseignants de DN MADE"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.97"
publish = false

[lib]
name = "dnmax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
tempfile = "3"
